[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal multimodal AI agent: inbox/calendar, voice memos, general companion"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2,<0.7.0",
    "anthropic>=0.120.0",
    "faster-whisper>=1.2.1",
    "python-dotenv>=1.0.1",
    "google-api-python-client>=2.149.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "click>=8.1.7",
    "pydantic>=2.9",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's File()/Depends() in defaults is the framework's intended style.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends"]

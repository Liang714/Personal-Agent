[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal multimodal AI agent: inbox/calendar, voice memos, general companion"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "faster-whisper>=1.2.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.1",
    "google-api-python-client>=2.149.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "sqlalchemy>=2.0.36",
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
